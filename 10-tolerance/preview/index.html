<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>公差查询 · 界面预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body {
    background: #FFFFFF;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: #101014;
  }
  body { width: 390px; overflow-x: hidden; }

  .page { padding: 12px 16.6px 30px; }

  /* 顶部 */
  .hero { padding-top: 8px; }
  .h1 { font-size: 27px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.2; }
  .sub { margin-top: 6px; font-size: 13.5px; color: #86868E; line-height: 1.5; }

  /* 输入 */
  .form { margin-top: 14px; background: #F6F6F8; border-radius: 13px; padding: 2px 14px 0; }
  .formhead { display: flex; align-items: center; justify-content: space-between; height: 31px; }
  .fh-t { font-size: 11.5px; color: #B4B4BC; }
  .fh-btn { font-size: 11.5px; color: #FF4D3D; padding-left: 13px; cursor: pointer; }

  .farea {
    display: block; width: 100%; height: 30px; border: none; outline: none; resize: none;
    background: transparent; font-family: inherit; font-size: 19px; line-height: 22px;
    color: #101014; padding: 2px 0 4px; font-weight: 600;
    font-variant-numeric: tabular-nums; overflow: hidden;
  }
  .farea::placeholder { color: #C6C6CE; font-weight: 400; font-size: 15px; }

  .ffoot {
    display: flex; align-items: center; justify-content: space-between;
    height: 33px; border-top: 1px solid #EDEDF0;
  }
  .fstat { font-size: 11px; color: #B4B4BC; }
  .fstat.warn { color: #D93A2B; }

  /* chips 区块 */
  .sec { margin-top: 12px; }
  .sec-label { font-size: 11.5px; color: #86868E; margin-bottom: 7px; }
  .hint { margin-top: 5px; font-size: 11px; color: #B4B4BC; }

  .chips { display: flex; flex-wrap: wrap; }
  .chip {
    margin-right: 7px; margin-bottom: 7px; padding: 5px 12px; border-radius: 999px;
    border: 1px solid #E6E6EA; font-size: 12.5px; color: #3A3A42; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .chip.on { background: #101014; border-color: #101014; color: #FFFFFF; font-weight: 600; }

  /* 主按钮 */
  .gen {
    margin-top: 12px; height: 42px; border-radius: 9px; background: #FF4D3D;
    color: #FFFFFF; font-size: 14.5px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }

  /* 结果 */
  .res { margin-top: 16px; }
  .res-head { display: flex; justify-content: space-between; align-items: baseline; }
  .res-title { font-size: 12.5px; color: #86868E; }
  .res-count { font-size: 11px; color: #B4B4BC; }

  .card { margin-top: 9px; border-radius: 11px; background: #FAFAFB; padding: 12px 13px 11px; }
  .card-top {
    display: flex; align-items: center; padding-bottom: 8px;
    border-bottom: 1px solid #EFEFF2;
  }
  .mark {
    font-size: 11px; font-weight: 600; border-radius: 4px; padding: 2px 6px;
    background: #EDEDF1; color: #101014;
  }
  .mark.hole { background: #EEF1FF; color: #3550C8; }
  .mark.shaft { background: #EAF6EE; color: #2C7A48; }
  .mark.fit { background: #F2F2F4; color: #4A4A52; }
  .mark.clearance { background: #EAF6EE; color: #2C7A48; }
  .mark.transition { background: #FFF4E0; color: #B26A00; }
  .mark.interference { background: #FFEFEC; color: #C0392B; }

  .card-spec { margin-left: 7px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .card-dim { margin-left: auto; font-size: 12px; color: #B4B4BC; font-variant-numeric: tabular-nums; }

  .kv { display: flex; justify-content: space-between; align-items: center; padding-top: 7px; }
  .kv-k { font-size: 12.5px; color: #86868E; }
  .kv-v { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .fit-card { background: #FFFBF7; }
  .card-copy { margin-left: auto; font-size: 12px; color: #FF4D3D; cursor: pointer; padding-left: 6px; }
  .card-copy.done { color: #B4B4BC; }

  /* 批量表 */
  .row-head {
    display: flex; margin-top: 6px; padding-bottom: 5px;
    border-bottom: 1px solid #F1F1F4; font-size: 10.5px; color: #C6C6CE;
  }
  .rh-size { width: 44px; flex-shrink: 0; }
  .rh-dev { flex: 1; }
  .rh-fit { width: 120px; text-align: right; }

  .row { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #F6F6F8; }
  .row-size {
    width: 44px; flex-shrink: 0; font-size: 12.5px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .row-dev { flex: 1; }
  .dev-hole { display: block; font-size: 11.5px; color: #3550C8; font-variant-numeric: tabular-nums; }
  .dev-shaft { display: block; margin-top: 2px; font-size: 11.5px; color: #2C7A48; font-variant-numeric: tabular-nums; }
  .row-fit {
    width: 120px; text-align: right; font-size: 11px; color: #6C6C76;
    font-variant-numeric: tabular-nums;
  }

  /* 解锁 */
  .unlock { margin-top: 15px; background: #FFF3F1; border-radius: 11px; padding: 13px 14px; cursor: pointer; }
  .unlock-main { font-size: 14.5px; font-weight: 600; color: #D93A2B; }
  .unlock-sub { margin-top: 4px; font-size: 11.5px; color: #C4746A; }
  .unlocked-tip { margin-top: 15px; font-size: 11.5px; color: #B4B4BC; text-align: center; }

  .empty {
    margin-top: 40px; display: flex; flex-direction: column; align-items: center;
  }
  .empty-line { width: 28px; height: 1px; background: #E6E6EA; }
  .empty-text { margin-top: 11px; font-size: 12px; color: #C6C6CE; }

  .note { margin-top: 18px; font-size: 10.5px; color: #B4B4BC; line-height: 1.85; }
  .footer { margin-top: 12px; text-align: center; font-size: 10.5px; color: #C6C6CE; }

  .toast {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(16,16,20,0.86); color: #fff; font-size: 13.5px;
    padding: 10px 18px; border-radius: 8px; opacity: 0; pointer-events: none;
    white-space: nowrap; z-index: 99;
  }
  .toast.show { opacity: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="page">

  <div class="hero">
    <div class="h1">公差查询</div>
    <div class="sub">输尺寸、选公差带，上下偏差和配合直接算出来</div>
  </div>

  <div class="form">
    <div class="formhead">
      <span class="fh-t">基本尺寸 mm</span>
      <div class="fh-a"><span class="fh-btn" id="clearBtn">清空</span></div>
    </div>
    <textarea class="farea" id="farea" placeholder="比如：25" maxlength="200"></textarea>
    <div class="ffoot">
      <span class="fstat" id="fstat">输入基本尺寸</span>
      <span class="fstat" id="fstate">上限 1 个</span>
    </div>
  </div>

  <div class="sec">
    <div class="sec-label">孔公差带</div>
    <div class="chips" id="holeChips"></div>
  </div>

  <div class="sec">
    <div class="sec-label">轴公差带</div>
    <div class="chips" id="shaftChips"></div>
    <div class="hint">大写是孔，小写是轴，和图纸上的写法一样</div>
  </div>

  <div class="gen" id="genBtn">查询偏差</div>

  <div class="res" id="res">
    <div class="res-head">
      <span class="res-title">查询结果</span>
      <span class="res-count" id="resCount"></span>
    </div>
    <div id="cards"></div>
    <div class="empty" id="resEmpty">
      <div class="empty-line"></div>
      <div class="empty-text">填一个尺寸，选好公差带，按下查询</div>
    </div>
  </div>

  <div id="batchWrap" class="hidden">
    <div class="res-head" style="margin-top:16px">
      <span class="res-title">逐尺寸对照</span>
      <span class="res-count" id="batchCount"></span>
    </div>
    <div class="row-head">
      <span class="rh-size">尺寸</span>
      <span class="rh-dev">孔 / 轴 偏差</span>
      <span class="rh-fit">配合</span>
    </div>
    <div id="rows"></div>
  </div>

  <div class="unlock" id="unlockBox">
    <div class="unlock-main">解锁批量查询</div>
    <div class="unlock-sub">看一段激励视频，一次算 8 个尺寸</div>
  </div>
  <div class="unlocked-tip hidden" id="unlockedTip">已解锁，一次最多 8 个尺寸</div>

  <div class="note">偏差按 GB/T 1800.1 查表；孔的基本偏差由同名轴换算得到。</div>

  <div class="footer">本地计算，不上传任何输入</div>
</div>

<div class="toast" id="toast"></div>

<script src="../miniprogram/core/tol.js"></script>
<script>
(function () {
  var K = window.Tol;

  var S = {
    text: '',
    hole: 'H7',
    shaft: 'g6',
    list: [],
    copied: false,
    unlocked: false,
    lastWarn: ''
  };

  var el = {
    farea: document.getElementById('farea'),
    fstat: document.getElementById('fstat'),
    fstate: document.getElementById('fstate'),
    holeChips: document.getElementById('holeChips'),
    shaftChips: document.getElementById('shaftChips'),
    genBtn: document.getElementById('genBtn'),
    cards: document.getElementById('cards'),
    resEmpty: document.getElementById('resEmpty'),
    resCount: document.getElementById('resCount'),
    batchWrap: document.getElementById('batchWrap'),
    batchCount: document.getElementById('batchCount'),
    rows: document.getElementById('rows'),
    unlockBox: document.getElementById('unlockBox'),
    unlockedTip: document.getElementById('unlockedTip'),
    clearBtn: document.getElementById('clearBtn'),
    toast: document.getElementById('toast')
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function limit() { return K.limitOf(S.unlocked); }

  /* ---------------- 渲染 ---------------- */

  function renderChips() {
    el.holeChips.innerHTML = K.HOLE_CHIPS.map(function (c) {
      return '<div class="chip' + (c === S.hole ? ' on' : '') + '" data-k="' + c + '">' + c + '</div>';
    }).join('');
    el.shaftChips.innerHTML = K.SHAFT_CHIPS.map(function (c) {
      return '<div class="chip' + (c === S.shaft ? ' on' : '') + '" data-k="' + c + '">' + c + '</div>';
    }).join('');
  }

  function kv(k, v) {
    return '<div class="kv"><span class="kv-k">' + esc(k) + '</span>' +
      '<span class="kv-v">' + esc(v) + '</span></div>';
  }

  function specCard(kind, r) {
    var L = kind === 'hole' ? r.hole : r.shaft;
    var a = kind === 'hole' ? 'ES' : 'es';
    var b = kind === 'hole' ? 'EI' : 'ei';
    return '<div class="card">' +
      '<div class="card-top">' +
        '<span class="mark ' + kind + '">' + (kind === 'hole' ? '孔' : '轴') + '</span>' +
        '<span class="card-spec">' + esc(L.spec) + '</span>' +
        '<span class="card-dim">⌀' + esc(K.fmtSize(r.size)) + '</span>' +
      '</div>' +
      kv('上偏差 ' + a, K.fmtMicron(L.es) + ' μm') +
      kv('下偏差 ' + b, K.fmtMicron(L.ei) + ' μm') +
      kv('极限尺寸', K.fmtRange(L.min, L.max)) +
    '</div>';
  }

  function fitCard(r) {
    var rows;
    if (r.type === 'clearance') {
      rows = kv('最小间隙', K.fmtMm(r.xmin).replace('+', '') + ' mm') +
        kv('最大间隙', K.fmtMm(r.xmax).replace('+', '') + ' mm');
    } else if (r.type === 'interference') {
      rows = kv('最小过盈', K.fmtMm(-r.xmax).replace('+', '') + ' mm') +
        kv('最大过盈', K.fmtMm(r.maxInterference).replace('+', '') + ' mm');
    } else {
      rows = kv('最大间隙', K.fmtMm(r.xmax).replace('+', '') + ' mm') +
        kv('最大过盈', K.fmtMm(r.maxInterference).replace('+', '') + ' mm');
    }
    return '<div class="card fit-card">' +
      '<div class="card-top">' +
        '<span class="mark ' + r.type + '">' + esc(r.typeName) + '</span>' +
        '<span class="card-spec">' + esc(r.hole.spec) + ' / ' + esc(r.shaft.spec) + '</span>' +
        '<span class="card-copy' + (S.copied ? ' done' : '') + '" id="copyBtn">' +
          (S.copied ? '已复制' : '复制') + '</span>' +
      '</div>' +
      rows +
      kv('配合公差', K.fmtMm(r.tf).replace('+', '') + ' mm') +
    '</div>';
  }

  function render() {
    var n = S.list.length;
    el.resCount.textContent = n ? ('⌀' + K.fmtSize(S.list[0].size) + ' · 尺寸段 ' + S.list[0].hole.bandCoarse) : '';
    el.genBtn.textContent = n ? '重新查询' : '查询偏差';

    if (n) {
      el.cards.innerHTML = specCard('hole', S.list[0]) + specCard('shaft', S.list[0]) +
        fitCard(S.list[0]);
      el.resEmpty.classList.add('hidden');
    } else {
      el.cards.innerHTML = '';
      el.resEmpty.classList.remove('hidden');
    }

    if (n > 1) {
      el.batchWrap.classList.remove('hidden');
      el.batchCount.textContent = n + ' 行';
      el.rows.innerHTML = S.list.map(function (r) {
        return '<div class="row">' +
          '<span class="row-size">' + esc(K.fmtSize(r.size)) + '</span>' +
          '<span class="row-dev">' +
            '<span class="dev-hole">' + esc(K.fmtMicron(r.hole.es) + ' / ' + K.fmtMicron(r.hole.ei)) + '</span>' +
            '<span class="dev-shaft">' + esc(K.fmtMicron(r.shaft.es) + ' / ' + K.fmtMicron(r.shaft.ei)) + '</span>' +
          '</span>' +
          '<span class="row-fit">' + esc(K.fitLine(r)) + '</span></div>';
      }).join('');
    } else {
      el.batchWrap.classList.add('hidden');
      el.rows.innerHTML = '';
    }

    el.unlockBox.classList.toggle('hidden', S.unlocked);
    el.unlockedTip.classList.toggle('hidden', !S.unlocked);
  }

  function parse() {
    var p = K.parseInput(S.text, limit());
    if (p.ok) {
      el.fstat.textContent = p.sizes.length + ' 个尺寸 · ' + K.bandCoarse(p.sizes[0]) + 'mm 段';
      el.fstat.classList.remove('warn');
    } else {
      el.fstat.textContent = p.message;
      el.fstat.classList.toggle('warn', p.code !== 'EMPTY');
    }
    el.fstate.textContent = '上限 ' + limit() + ' 个';
    return p;
  }

  var toastTimer = null;
  function toast(text) {
    el.toast.textContent = text;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove('show'); }, 1600);
  }
  function hideToast() {
    clearTimeout(toastTimer);
    el.toast.classList.remove('show');
  }

  function autoHeight() {
    var n = Math.min(3, Math.max(1, String(S.text).split('\n').length));
    el.farea.style.height = (n * 22 + 8) + 'px';
  }

  /* ---------------- 动作 ---------------- */

  function setSize(t) {
    S.text = String(t == null ? '' : t);
    el.farea.value = S.text;
    S.list = [];
    S.copied = false;
    autoHeight();
    parse();
    render();
    return true;
  }

  function setHole(k) {
    S.hole = k;
    renderChips();
    if (S.list.length) return generate();
    return true;
  }

  function setShaft(k) {
    S.shaft = k;
    renderChips();
    if (S.list.length) return generate();
    return true;
  }

  /** 一步设好孔和轴，截图脚本用这个切配合 */
  function setFit(h, s) {
    S.hole = h;
    S.shaft = s;
    renderChips();
    if (S.list.length) return generate();
    return true;
  }

  function generate() {
    var p = parse();
    if (!p.ok) { toast(p.message); return false; }
    var r = K.batch(S.text, S.hole, S.shaft, limit());
    if (!r.ok) { toast(r.message); return false; }
    S.list = r.list;
    S.copied = false;
    render();
    if (r.warning) toast(r.warning);
    return true;
  }

  function copy() {
    if (!S.list.length) { toast('先查一组公差'); return false; }
    S.copied = true;
    render();
    toast('已复制 ' + K.fmtSize(S.list[0].size) + ' 的偏差');
    return true;
  }

  function unlock() {
    S.unlocked = true;
    render();
    parse();
    toast('已解锁，一次查 8 个尺寸');
    return true;
  }

  function reset() {
    S.hole = 'H7';
    S.shaft = 'g6';
    S.list = [];
    S.unlocked = false;
    S.copied = false;
    renderChips();
    setSize('');
    return true;
  }

  /* ---------------- 交互 ---------------- */

  el.farea.addEventListener('input', function (e) { setSize(e.target.value); });
  el.holeChips.addEventListener('click', function (e) {
    var n = e.target.closest ? e.target.closest('.chip') : null;
    if (n) setHole(n.dataset.k);
  });
  el.shaftChips.addEventListener('click', function (e) {
    var n = e.target.closest ? e.target.closest('.chip') : null;
    if (n) setShaft(n.dataset.k);
  });
  el.genBtn.addEventListener('click', generate);
  el.clearBtn.addEventListener('click', function () { setSize(''); });
  el.unlockBox.addEventListener('click', unlock);
  el.cards.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('#copyBtn')) copy();
  });

  /* ---------------- 截图脚本的控制口 ---------------- */
  window.__ctl = {
    reset: reset,
    setSize: setSize,
    setXxx: setSize,
    setHole: setHole,
    setShaft: setShaft,
    setFit: setFit,
    generate: generate,
    copy: copy,
    unlock: unlock,
    toast: toast,
    hideToast: hideToast,
    scrollTo: function (y) { window.scrollTo(0, y); },
    scrollTop: function () { window.scrollTo(0, 0); },
    state: function () { return S; }
  };

  renderChips();
  setSize('');
})();
</script>
</body>
</html>
