<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>文本润色 · 界面预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body {
    background: #FFFFFF;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: #101014;
  }
  body { width: 390px; overflow-x: hidden; }

  .page { padding: 12.5px 16.6px 31px; }

  /* 顶部 */
  .hero { padding-top: 8.3px; }
  .h1 { font-size: 27px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.2; }
  .sub { margin-top: 6.2px; font-size: 13.5px; color: #86868E; line-height: 1.5; }

  /* 原文 */
  .field { margin-top: 20.8px; background: #F6F6F8; border-radius: 12.5px; padding: 12.5px 14.5px 9.4px; }
  .field-top { display: flex; justify-content: space-between; align-items: center; }
  .field-label { font-size: 12.5px; color: #86868E; }
  .field-count { font-size: 11.5px; color: #B4B4BC; }
  .ta {
    margin-top: 7.3px; font-size: 15.6px; line-height: 1.62; color: #101014;
    min-height: 87px; word-break: break-all;
  }
  .ta.ph { color: #B4B4BC; font-size: 15.1px; }
  .caret {
    display: none; width: 1.5px; height: 17px; background: #FF4D3D;
    margin-left: 1px; vertical-align: -3px; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .field-actions { margin-top: 5.2px; display: flex; justify-content: space-between; }
  .link { font-size: 12px; color: #FF4D3D; }

  /* 区块 */
  .section { margin-top: 18.7px; }
  .section-label { font-size: 12.5px; color: #86868E; margin-bottom: 8.3px; }
  .hint { margin-top: 7.3px; font-size: 11.5px; color: #B4B4BC; }

  .chips { display: flex; flex-wrap: wrap; }
  .chip {
    margin: 0 7.3px 7.3px 0; padding: 7.3px 14.5px; border-radius: 999px;
    border: 1px solid #E6E6EA; font-size: 13.5px; color: #3A3A42;
  }
  .chip.on { background: #101014; border-color: #101014; color: #FFFFFF; font-weight: 600; }

  /* 主按钮 */
  .btn-primary {
    margin-top: 20.8px; height: 52px; border-radius: 11.5px; background: #FF4D3D;
    color: #FFFFFF; font-size: 16.1px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; letter-spacing: 0.5px;
  }
  .btn-primary.dim { opacity: 0.55; }

  /* 结果 */
  .result-head { margin-top: 27px; display: flex; justify-content: space-between; align-items: baseline; }
  .result-title { font-size: 13.5px; color: #86868E; }
  .result-count { font-size: 12px; color: #B4B4BC; }
  .out {
    margin-top: 9.4px; font-size: 16.1px; line-height: 1.72; letter-spacing: 0.1px;
    word-break: break-all;
  }
  .item-bottom {
    margin-top: 10.4px; padding-bottom: 11.5px; border-bottom: 1px solid #F1F1F4;
    display: flex; justify-content: space-between; align-items: center;
  }
  .meta { display: flex; align-items: center; }
  .tag {
    font-size: 10.4px; color: #86868E; background: #F4F4F6;
    border-radius: 3px; padding: 2px 6px; margin-right: 6px;
  }
  .len { font-size: 10.4px; color: #C6C6CE; }
  .copy { font-size: 12.5px; color: #FF4D3D; padding: 3px 2px 3px 12px; }
  .copy.done { color: #B4B4BC; }

  /* 改动清单 */
  .changes { margin-top: 12.5px; }
  .changes-label { font-size: 11.5px; color: #B4B4BC; margin-bottom: 7.3px; }
  .chg {
    display: flex; align-items: center; padding: 6.2px 0;
    border-bottom: 1px solid #F7F7F9; font-size: 12.5px;
  }
  .chg-from {
    color: #86868E; text-decoration: line-through; max-width: 156px;
    overflow: hidden; white-space: nowrap;
  }
  .chg-arrow { margin: 0 8.3px; color: #C6C6CE; font-size: 10.4px; }
  .chg-to { color: #101014; }

  /* 解锁 */
  .unlock { margin-top: 17.7px; background: #FFF3F1; border-radius: 11.5px; padding: 13.5px 14.5px; }
  .unlock-main { font-size: 15px; font-weight: 600; color: #D93A2B; }
  .unlock-sub { margin-top: 4.2px; font-size: 12px; color: #C4746A; }
  .unlocked-tip { margin-top: 17.7px; font-size: 12px; color: #B4B4BC; text-align: center; }

  /* 空态 */
  .empty { margin-top: 45.8px; display: flex; flex-direction: column; align-items: center; }
  .empty-line { width: 29px; height: 1px; background: #E6E6EA; }
  .empty-text { margin-top: 11.5px; font-size: 12.5px; color: #C6C6CE; }

  .footer { margin-top: 33px; text-align: center; font-size: 11px; color: #C6C6CE; }

  /* toast */
  .toast {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(16,16,20,0.86); color: #fff; font-size: 13.5px;
    padding: 10px 18px; border-radius: 8px; opacity: 0; pointer-events: none;
    white-space: nowrap; z-index: 99; max-width: 320px; line-height: 1.4;
  }
  .toast.show { opacity: 1; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="page">

  <div class="hero">
    <div class="h1">文本润色</div>
    <div class="sub">一段话，四种改法：精简、扩写、转书面、降重</div>
  </div>

  <div class="field">
    <div class="field-top">
      <span class="field-label">原文</span>
      <span class="field-count" id="len">0/1000</span>
    </div>
    <div class="ta ph" id="ta">贴一段要改的文字，最多 1000 字<span class="caret" id="caret"></span></div>
    <div class="field-actions">
      <span class="link">用一段示例</span>
      <span class="link hidden" id="clearBtn">清空</span>
    </div>
  </div>

  <div class="section">
    <div class="section-label">改法</div>
    <div class="chips" id="chips">
      <div class="chip on" data-id="tight">精简</div>
      <div class="chip" data-id="expand">扩写</div>
      <div class="chip" data-id="formal">口语转书面</div>
      <div class="chip" data-id="rewrite">改写降重</div>
    </div>
    <div class="hint" id="modeDesc">删掉填充词，同样的意思更短</div>
  </div>

  <div class="btn-primary" id="btn">开始润色</div>

  <div id="resultWrap" class="hidden">
    <div class="result-head">
      <span class="result-title">改后</span>
      <span class="result-count" id="delta">—</span>
    </div>
    <div class="out" id="out"></div>
    <div class="item-bottom">
      <span class="meta">
        <span class="tag" id="modeTag">精简</span>
        <span class="len" id="changeCount">0 处改动</span>
      </span>
      <span class="copy" id="copyBtn">复制</span>
    </div>
    <div class="changes" id="changes">
      <div class="changes-label">改了这些</div>
      <div id="chgList"></div>
    </div>
    <div class="unlock" id="unlock">
      <div class="unlock-main">解锁不限次</div>
      <div class="unlock-sub">免费 2 次之后，看一段激励视频即可无限改</div>
    </div>
    <div class="unlocked-tip hidden" id="unlockedTip">已解锁，不限次数</div>
  </div>

  <div class="empty" id="empty">
    <div class="empty-line"></div>
    <div class="empty-text">贴上文字，选一种改法</div>
  </div>

  <div class="footer">本地处理，不上传任何文字</div>
</div>

<div class="toast" id="toast"></div>

<script src="../miniprogram/core/polish.js"></script>
<script>
(function () {
  var S = {
    text: '',
    mode: 'tight',
    seed: 1,
    result: null,
    unlocked: false
  };

  var el = {
    ta: document.getElementById('ta'),
    len: document.getElementById('len'),
    clearBtn: document.getElementById('clearBtn'),
    chips: document.getElementById('chips'),
    modeDesc: document.getElementById('modeDesc'),
    btn: document.getElementById('btn'),
    resultWrap: document.getElementById('resultWrap'),
    delta: document.getElementById('delta'),
    out: document.getElementById('out'),
    modeTag: document.getElementById('modeTag'),
    changeCount: document.getElementById('changeCount'),
    copyBtn: document.getElementById('copyBtn'),
    changes: document.getElementById('changes'),
    chgList: document.getElementById('chgList'),
    unlock: document.getElementById('unlock'),
    unlockedTip: document.getElementById('unlockedTip'),
    empty: document.getElementById('empty'),
    toast: document.getElementById('toast')
  };

  var PH = '贴一段要改的文字，最多 1000 字';
  var toastTimer = null;

  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
  }

  function render() {
    if (S.text) {
      el.ta.className = 'ta';
      el.ta.innerHTML = esc(S.text) + '<span class="caret" id="caret"></span>';
      el.clearBtn.classList.remove('hidden');
    } else {
      el.ta.className = 'ta ph';
      el.ta.innerHTML = PH + '<span class="caret" id="caret"></span>';
      el.clearBtn.classList.add('hidden');
    }
    el.len.textContent = S.text.length + '/1000';

    [].forEach.call(el.chips.children, function (n) {
      n.className = 'chip' + (n.dataset.id === S.mode ? ' on' : '');
    });
    el.modeDesc.textContent = Polish.modeDesc(S.mode);

    el.btn.textContent = S.result ? '再跑一次' : '开始润色';

    var r = S.result;
    if (r) {
      el.resultWrap.classList.remove('hidden');
      el.empty.classList.add('hidden');
      el.modeTag.textContent = r.modeName;
      el.changeCount.textContent = r.changeCount + ' 处改动';
      el.delta.textContent = r.delta === 0
        ? r.before.chars + ' 字 · ' + r.changeCount + ' 处改动'
        : r.before.chars + ' 字 → ' + r.after.chars + ' 字 · ' +
          (r.delta > 0 ? '多 ' : '少 ') + Math.abs(r.delta) + ' 字';
      el.out.textContent = r.text;

      var html = '';
      r.changes.forEach(function (c) {
        html += '<div class="chg"><span class="chg-from">' + esc(c.from) +
          '</span><span class="chg-arrow">→</span><span class="chg-to">' +
          esc(c.to || '删掉') + '</span></div>';
      });
      el.chgList.innerHTML = html;
      el.changes.classList.toggle('hidden', !r.changes.length);

      el.unlock.classList.toggle('hidden', S.unlocked);
      el.unlockedTip.classList.toggle('hidden', !S.unlocked);
      el.copyBtn.classList.remove('done');
    } else {
      el.resultWrap.classList.add('hidden');
      el.empty.classList.remove('hidden');
    }
  }

  function toast(text) {
    el.toast.textContent = text;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove('show'); }, 1600);
  }

  function run() {
    var r = Polish.polish(S.text, S.mode, { seed: S.seed });
    if (!r.ok) { toast(r.message); return false; }
    S.result = {
      text: r.text,
      changes: r.changes,
      changeCount: r.changeCount,
      modeName: r.modeName,
      before: r.before,
      after: r.after,
      delta: r.delta
    };
    render();
    if (r.warning) toast(r.warning);
    return true;
  }

  // 截图脚本用的控制口
  window.__ctl = {
    reset: function () {
      S = { text: '', mode: 'tight', seed: 1, result: null, unlocked: false };
      render();
    },
    setText: function (t) {
      S.text = String(t || '');
      S.result = null;
      render();
    },
    setMode: function (m) { S.mode = m; S.result = null; render(); },
    setSeed: function (s) { S.seed = s; },
    generate: function () { return run(); },
    run: run,
    unlock: function () { S.unlocked = true; render(); },
    copy: function () {
      el.copyBtn.classList.add('done');
      el.copyBtn.textContent = '已复制';
      toast('已复制');
    },
    toast: toast,
    hideToast: function () { el.toast.classList.remove('show'); },
    scrollTo: function (y) { window.scrollTo(0, y); },
    focus: function (on) {
      var c = document.getElementById('caret');
      if (c) c.style.display = on ? 'inline-block' : 'none';
    },
    state: function () { return S; }
  };

  render();
})();
</script>
</body>
</html>
