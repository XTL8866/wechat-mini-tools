<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>图片九宫格切图 · 界面预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body {
    background: #FFFFFF;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: #101014;
  }
  /* 底部留白：准备页正好一屏装满，滚不下去，主按钮就被字幕压住。
     多垫一屏 96px 的空，滚到「预览图顶边」时按钮才上得来。 */
  body { width: 390px; overflow-x: hidden; padding-bottom: 96px; }

  .page { padding: 12.5px 16.6px 31px; }

  .hero { padding-top: 8.3px; }
  .h1 { font-size: 27px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.2; }
  .sub { margin-top: 6.2px; font-size: 13.5px; color: #86868E; line-height: 1.5; }

  /* 画布 */
  .stage {
    margin-top: 16.6px; position: relative; background: #F6F6F8;
    border-radius: 12.5px; display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #cv { display: block; border-radius: 12.5px; }
  .stage-empty {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .plus { font-size: 31px; color: #C6C6CE; line-height: 1; font-weight: 300; }
  .stage-empty-text { margin-top: 8.3px; font-size: 13px; color: #B4B4BC; }
  .stage-actions { margin-top: 8.3px; display: flex; justify-content: space-between; }
  .link { font-size: 12px; color: #2E5BE6; }
  .link.gray { color: #B4B4BC; }

  /* 区块 */
  .section { margin-top: 7px; }
  .section-label { font-size: 12.5px; color: #86868E; margin-bottom: 8.3px; }
  .hint { margin-top: 6.2px; font-size: 11.5px; color: #B4B4BC; line-height: 1.5; }
  .hint b { color: #3A3A42; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; }
  .chip {
    margin: 0 7.3px 7.3px 0; padding: 7.3px 15.6px; border-radius: 999px;
    border: 1px solid #E6E6EA; font-size: 13.5px; color: #3A3A42; line-height: 1.2;
  }
  .chip.on { background: #101014; border-color: #101014; color: #FFFFFF; }
  .chip.sm { padding: 6.2px 13.5px; font-size: 12.5px; }

  /* 主按钮 */
  .btn-primary {
    margin-top: 33px; height: 52px; border-radius: 11.5px; background: #2E5BE6;
    color: #FFFFFF; font-size: 16.1px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; letter-spacing: 0.5px;
  }
  .btn-primary.dim { opacity: 0.55; }

  /* 结果 */
  .result-head { margin-top: 20px; display: flex; justify-content: space-between; align-items: baseline; }
  .result-right { display: flex; align-items: baseline; }
  .result-right .link { margin-left: 12px; }
  .result-title { font-size: 13.5px; color: #86868E; }
  .result-count { font-size: 12px; color: #B4B4BC; }
  .meta-row {
    margin-top: 8.3px; padding-bottom: 10.4px; border-bottom: 1px solid #F1F1F4;
    display: flex; align-items: center;
  }
  .tag {
    font-size: 10.4px; color: #86868E; background: #F4F4F6;
    border-radius: 3px; padding: 2px 6px; margin-right: 6px;
  }
  .len { font-size: 10.4px; color: #C6C6CE; }

  /* 九格结果板 */
  .board { margin-top: 13.5px; display: flex; flex-wrap: wrap; }
  .cell { position: relative; background: #FFFFFF; box-shadow: 0 1px 4px rgba(16,16,20,0.13); }
  .cell canvas { display: block; }
  .cell-no {
    position: absolute; left: 4px; top: 4px; min-width: 15px; height: 15px;
    border-radius: 4px; background: rgba(16,16,20,0.62); color: #FFFFFF;
    font-size: 9.5px; line-height: 15px; text-align: center; padding: 0 3px;
  }
  .board-cap { margin-top: 9.4px; font-size: 11.5px; color: #B4B4BC; }

  .btn-save {
    margin-top: 14.6px; height: 50px; border-radius: 11.5px; border: 1px solid #101014;
    color: #101014; font-size: 15px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-save.done { border-color: #C6C6CE; color: #B4B4BC; }

  .unlock { margin-top: 90px; background: #EEF2FF; border-radius: 11.5px; padding: 13.5px 14.5px; }
  .unlock-main { font-size: 15px; font-weight: 600; color: #2E5BE6; }
  .unlock-sub { margin-top: 4.2px; font-size: 12px; color: #6E82BF; }
  .unlocked-tip { margin-top: 15.6px; font-size: 12px; color: #B4B4BC; text-align: center; }

  .empty { margin-top: 30px; display: flex; flex-direction: column; align-items: center; }
  .empty-line { width: 29px; height: 1px; background: #E6E6EA; }
  .empty-text { margin-top: 11.5px; font-size: 12.5px; color: #C6C6CE; }

  .footer { margin-top: 26px; text-align: center; font-size: 11px; color: #C6C6CE; }

  .toast {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(16,16,20,0.86); color: #fff; font-size: 13.5px;
    padding: 10px 18px; border-radius: 8px; opacity: 0; pointer-events: none;
    white-space: nowrap; z-index: 99; max-width: 320px; line-height: 1.4;
  }
  .toast.show { opacity: 1; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="page">

  <div class="hero">
    <div class="h1">图片九宫格切图</div>
    <div class="sub">一张整图切成九张方图，顺序按行排好</div>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="stage-empty" id="stageEmpty">
      <div class="plus">＋</div>
      <div class="stage-empty-text">选一张图片</div>
    </div>
  </div>

  <div class="stage-actions">
    <span class="link" id="pickBtn">换一张</span>
    <span class="link" id="sampleBtn">用示例图</span>
    <span class="link gray" id="sizeLabel">—</span>
  </div>

  <div class="section">
    <div class="section-label">切法</div>
    <div class="chips" id="gridChips"></div>
    <div class="hint" id="gridHint">九张，朋友圈标准</div>
  </div>

  <div class="section">
    <div class="section-label">白边</div>
    <div class="chips" id="padChips"></div>
    <div class="hint" id="padHint">每张自带一圈白边，排在一起有分隔感</div>
  </div>

  <div class="btn-primary" id="btn">切成 9 张</div>

  <div id="resultWrap" class="hidden">
    <div class="result-head">
      <span class="result-title">切好了</span>
      <span class="result-right">
        <span class="result-count" id="resultSize">—</span>
        <span class="link" id="retryBtn">重新切</span>
      </span>
    </div>
    <div class="meta-row">
      <span class="tag" id="resGrid">3×3</span>
      <span class="len" id="resMeta">—</span>
    </div>
    <div class="board" id="board"></div>
    <div class="board-cap" id="boardCap">—</div>
    <div class="btn-save" id="saveBtn">保存九张</div>
    <div class="unlock" id="unlock">
      <div class="unlock-main">解锁不限次</div>
      <div class="unlock-sub">免费 2 次之后，看一段激励视频即可无限切</div>
    </div>
    <div class="unlocked-tip hidden" id="unlockedTip">已解锁，不限次数</div>
  </div>

  <div class="empty" id="empty">
    <div class="empty-line"></div>
    <div class="empty-text">选图 → 选切法 → 保存九张</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="../miniprogram/core/gridcut.js"></script>
<script>
(function () {
  var STAGE_W = 356.8;
  var SRC_W = 1200, SRC_H = 900;      // 示例图原始尺寸（4:3，故意不是方的）
  var MAX_STAGE_H = 268;

  var S = {
    img: null,          // {w,h,kind}
    grid: '3',
    pad: 'none',
    result: false,
    unlocked: false,
    saved: false,
    plan: null
  };

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');

  var el = {
    stage: document.getElementById('stage'),
    stageEmpty: document.getElementById('stageEmpty'),
    gridChips: document.getElementById('gridChips'),
    gridHint: document.getElementById('gridHint'),
    padChips: document.getElementById('padChips'),
    padHint: document.getElementById('padHint'),
    btn: document.getElementById('btn'),
    resultWrap: document.getElementById('resultWrap'),
    resultSize: document.getElementById('resultSize'),
    resGrid: document.getElementById('resGrid'),
    resMeta: document.getElementById('resMeta'),
    board: document.getElementById('board'),
    boardCap: document.getElementById('boardCap'),
    saveBtn: document.getElementById('saveBtn'),
    unlock: document.getElementById('unlock'),
    unlockedTip: document.getElementById('unlockedTip'),
    empty: document.getElementById('empty'),
    sizeLabel: document.getElementById('sizeLabel'),
    toast: document.getElementById('toast')
  };

  var toastTimer = null;
  function toast(t) {
    el.toast.textContent = t;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove('show'); }, 1600);
  }

  /* ---------- 画示例图（和小程序里那份逐行对应） ---------- */

  function drawLayers(c, layers, w, h) {
    layers.forEach(function (L) {
      c.save();
      if (L.type === 'linear') {
        var g = c.createLinearGradient(L.x0, L.y0, L.x1, L.y1);
        L.stops.forEach(function (s) { g.addColorStop(s[0], s[1]); });
        c.fillStyle = g;
        c.fillRect(0, 0, w, h);
      } else if (L.type === 'circle') {
        c.fillStyle = L.fill;
        c.beginPath();
        c.arc(L.cx, L.cy, L.r, 0, Math.PI * 2);
        c.fill();
      } else if (L.type === 'rect') {
        c.fillStyle = L.fill;
        c.fillRect(L.x, L.y, L.w, L.h);
      } else if (L.type === 'poly') {
        c.fillStyle = L.fill;
        c.beginPath();
        L.pts.forEach(function (p, i) { i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); });
        c.closePath();
        c.fill();
      }
      c.restore();
    });
  }

  /** 原图离屏画布：切图时从这张上面取料 */
  var srcCv = document.createElement('canvas');

  function paintSource(kind) {
    srcCv.width = SRC_W;
    srcCv.height = SRC_H;
    var c = srcCv.getContext('2d');
    c.clearRect(0, 0, SRC_W, SRC_H);
    drawLayers(c, GridCut.samplePhoto(kind, SRC_W, SRC_H), SRC_W, SRC_H);
  }

  /* ---------- 预览画布：图 + 网格线 + 裁掉的部分压暗 ---------- */

  function stageSize() {
    var w = STAGE_W, h = w * (S.img ? S.img.h / S.img.w : 3 / 4);
    if (h > MAX_STAGE_H) { h = MAX_STAGE_H; w = h * (S.img ? S.img.w / S.img.h : 4 / 3); }
    return { w: Math.round(w), h: Math.round(h) };
  }

  function fitStage() {
    var s = stageSize();
    cv.style.width = s.w + 'px';
    cv.style.height = s.h + 'px';
    el.stage.style.height = s.h + 'px';
    return s;
  }

  function paintStage() {
    var s = fitStage();
    if (!S.img) {
      cv.width = 900; cv.height = 675;
      ctx.clearRect(0, 0, 900, 675);
      return;
    }
    var dpr = 2;
    cv.width = s.w * dpr;
    cv.height = s.h * dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.drawImage(srcCv, 0, 0, cv.width, cv.height);

    var plan = GridCut.buildPlan({ imgW: S.img.w, imgH: S.img.h, grid: S.grid, pad: S.pad });
    if (!plan.ok) return;

    var kx = cv.width / S.img.w, ky = cv.height / S.img.h;
    var crop = plan.src.crop;

    // 会被裁掉的部分压暗：让「非方图会裁边」在预览里直接看得见
    ctx.fillStyle = 'rgba(8,8,10,0.58)';
    if (crop.x > 0) ctx.fillRect(0, 0, crop.x * kx, cv.height);
    if (crop.x + crop.w < S.img.w) {
      ctx.fillRect((crop.x + crop.w) * kx, 0, cv.width - (crop.x + crop.w) * kx, cv.height);
    }
    if (crop.y > 0) ctx.fillRect(0, 0, cv.width, crop.y * ky);
    if (crop.y + crop.h < S.img.h) {
      ctx.fillRect(0, (crop.y + crop.h) * ky, cv.width, cv.height - (crop.y + crop.h) * ky);
    }

    // 网格线
    var n = plan.grid.n;
    ctx.strokeStyle = 'rgba(255,255,255,0.92)';
    ctx.lineWidth = 2 * dpr;
    for (var i = 1; i < n; i++) {
      var gx = (crop.x + crop.w * i / n) * kx;
      var gy = (crop.y + crop.h * i / n) * ky;
      ctx.beginPath(); ctx.moveTo(gx, crop.y * ky); ctx.lineTo(gx, (crop.y + crop.h) * ky); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(crop.x * kx, gy); ctx.lineTo((crop.x + crop.w) * kx, gy); ctx.stroke();
    }
  }

  /* ---------- 结果板：真按计划从原图取料画小图 ---------- */

  function paintBoard(plan) {
    el.board.innerHTML = '';
    var m = GridCut.montage(plan, STAGE_W, 7);
    plan.cells.forEach(function (cell, idx) {
      var d = document.createElement('div');
      d.className = 'cell';
      d.style.width = m.cell + 'px';
      d.style.height = m.cell + 'px';
      d.style.marginRight = (idx % m.cols === m.cols - 1 ? 0 : m.gap) + 'px';
      d.style.marginBottom = m.gap + 'px';

      var c = document.createElement('canvas');
      var dpr = 2;
      c.width = m.cell * dpr;
      c.height = m.cell * dpr;
      c.style.width = m.cell + 'px';
      c.style.height = m.cell + 'px';
      var cc = c.getContext('2d');
      var p = plan.out.padPx / plan.out.cell;      // 白边比例，与导出尺寸无关
      var inner = m.cell * (1 - p * 2);
      cc.fillStyle = plan.out.bg;
      cc.fillRect(0, 0, c.width, c.height);
      cc.drawImage(srcCv, cell.sx, cell.sy, cell.sw, cell.sh,
                   m.cell * p * dpr, m.cell * p * dpr, inner * dpr, inner * dpr);

      var no = document.createElement('div');
      no.className = 'cell-no';
      no.textContent = idx + 1;
      d.appendChild(c);
      d.appendChild(no);
      el.board.appendChild(d);
    });
  }

  /* ---------- 渲染 ---------- */

  function render() {
    [].forEach.call(el.gridChips.children, function (n) {
      n.className = 'chip' + (n.dataset.id === S.grid ? ' on' : '');
    });
    [].forEach.call(el.padChips.children, function (n) {
      n.className = 'chip' + (n.dataset.id === S.pad ? ' on' : '');
    });
    GridCut.GRIDS.forEach(function (g) { if (g.id === S.grid) el.gridHint.textContent = g.desc; });
    GridCut.PADS.forEach(function (p) {
      if (p.id === S.pad) {
        el.padHint.textContent = p.ratio === 0
          ? '不留白：九张拼回去严丝合缝'
          : '每张内缩 ' + Math.round(p.ratio * 1000) / 10 + '%，排在一起有分隔感';
      }
    });

    el.stageEmpty.classList.toggle('hidden', !!S.img);
    // 切完之后主按钮就没用了 —— 收掉它，把「重新切」降级成标题旁的文字链，
    // 结果区只留一个「保存」主按钮，画面才不会被两个蓝块挤满
    el.btn.classList.toggle('hidden', !!S.plan);
    el.btn.textContent = '切成 ' + GridCut.gridOf(S.grid).n * GridCut.gridOf(S.grid).n + ' 张';
    el.saveBtn.className = 'btn-save' + (S.saved ? ' done' : '');
    el.saveBtn.textContent = S.saved ? '已保存到相册' : ('保存' + (S.plan ? S.plan.count + ' 张' : ''));

    if (S.plan) {
      var p = S.plan;
      el.resultWrap.classList.remove('hidden');
      el.empty.classList.add('hidden');
      el.sizeLabel.classList.remove('hidden');
      el.sizeLabel.textContent = p.src.w + ' × ' + p.src.h;
      el.resultSize.textContent = p.count + ' 张 · 每张 ' + p.out.cell;
      el.resGrid.textContent = p.grid.name;
      el.resMeta.textContent = '白边 ' + p.out.padPx + 'px · 内容 ' + p.out.inner + 'px';
      el.boardCap.textContent = '按行排：左上第 1 张，右下第 ' + p.count + ' 张';
      el.unlock.classList.toggle('hidden', S.unlocked);
      el.unlockedTip.classList.toggle('hidden', !S.unlocked);
    } else {
      el.resultWrap.classList.add('hidden');
      // 空态只在真的没选图时出现：选完图还没切的时候它挤在按钮下面，
      // 视频里正好被字幕压住，也让页面白白高出 60px
      el.empty.classList.toggle('hidden', !!S.img);
      el.sizeLabel.classList.add('hidden');
    }
  }

  function boot() {
    el.gridChips.innerHTML = GridCut.GRIDS.map(function (g) {
      return '<div class="chip" data-id="' + g.id + '">' + g.name + '</div>';
    }).join('');
    el.padChips.innerHTML = GridCut.PADS.map(function (p) {
      return '<div class="chip sm" data-id="' + p.id + '">' + p.name + '</div>';
    }).join('');
    render();
    paintStage();
  }

  /* ---------- 动作 ---------- */

  function setImage(kind) {
    S.img = { w: SRC_W, h: SRC_H, kind: kind || 'day' };
    S.result = false; S.plan = null; S.saved = false;
    paintSource(S.img.kind);
    paintStage();
    render();
    return true;
  }

  function setGrid(id) {
    S.grid = GridCut.gridOf(id).id;
    S.result = false; S.plan = null; S.saved = false;
    paintStage();
    render();
    return true;
  }

  function setPad(id) {
    S.pad = GridCut.padOf(id).id;
    if (S.plan) {   // 已经切过就直接重切，不用再点一次按钮
      return generate();
    }
    paintStage();
    render();
    return true;
  }

  function generate() {
    if (!S.img) { toast('先选一张图'); return false; }
    var plan = GridCut.buildPlan({
      imgW: S.img.w, imgH: S.img.h, grid: S.grid, pad: S.pad, out: 1080
    });
    if (!plan.ok) { toast(plan.message); return false; }
    S.plan = plan;
    S.result = true;
    S.saved = false;
    paintBoard(plan);
    render();
    return true;
  }

  /* ---------- 交互 ---------- */

  document.getElementById('sampleBtn').addEventListener('click', function () { setImage('day'); });
  document.getElementById('pickBtn').addEventListener('click', function () {
    // 预览页没有相册，换一张就是换色调，行为对截图脚本一致
    setImage(S.img && S.img.kind === 'day' ? 'dusk' : 'day');
  });
  el.gridChips.addEventListener('click', function (e) {
    var n = e.target.closest ? e.target.closest('.chip') : null;
    if (n) setGrid(n.dataset.id);
  });
  el.padChips.addEventListener('click', function (e) {
    var n = e.target.closest ? e.target.closest('.chip') : null;
    if (n) setPad(n.dataset.id);
  });
  el.btn.addEventListener('click', generate);
  document.getElementById('retryBtn').addEventListener('click', generate);
  el.saveBtn.addEventListener('click', function () {
    if (!S.plan) { toast('先切一次'); return; }
    S.saved = true; render(); toast('已保存 ' + S.plan.count + ' 张到相册');
  });
  el.unlock.addEventListener('click', function () {
    S.unlocked = true; render(); toast('已解锁，不限次数');
  });

  /* ---------- 截图脚本的控制口 ---------- */
  window.__ctl = {
    reset: function () {
      S.img = null; S.grid = '3'; S.pad = 'none';
      S.result = false; S.unlocked = false; S.saved = false; S.plan = null;
      cv.width = 900; cv.height = 675;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, 900, 675);
      render();
      return true;
    },
    setImage: setImage,
    setGrid: setGrid,
    setPad: setPad,
    setXxx: setGrid,
    generate: generate,
    unlock: function () { S.unlocked = true; render(); toast('已解锁，不限次数'); return true; },
    save: function () { S.saved = true; render(); toast('已保存到相册'); return true; },
    copy: function () { S.saved = true; render(); return true; },
    toast: toast,
    hideToast: function () { clearTimeout(toastTimer); el.toast.classList.remove('show'); },
    scrollTo: function (y) { window.scrollTo(0, y); },
    scrollTop: function () { window.scrollTo(0, 0); },
    state: function () {
      return {
        img: S.img, grid: S.grid, pad: S.pad, result: S.result,
        unlocked: S.unlocked, saved: S.saved, plan: S.plan,
        page: document.body.scrollHeight
      };
    },
    measure: function () {
      var q = function (s) { return document.querySelector(s); };
      var px = function (e) {
        return e ? Math.round((e.getBoundingClientRect().top + window.scrollY) * 2.7692) : -1;
      };
      var pb = function (e) {
        return e ? Math.round((e.getBoundingClientRect().bottom + window.scrollY) * 2.7692) : -1;
      };
      return {
        page: Math.round(document.body.scrollHeight * 2.7692),
        stage: px(q('#stage')), stageBot: pb(q('#stage')),
        gridSec: px(q('#gridChips')), padSec: px(q('#padChips')),
        btn: px(q('#btn')), btnBot: pb(q('#btn')),
        head: px(q('.result-head')), board: px(q('#board')), boardBot: pb(q('#board')),
        cap: px(q('.board-cap')), save: px(q('#saveBtn')), saveBot: pb(q('#saveBtn')),
        unlock: px(q('#unlock')), unlockBot: pb(q('#unlock')),
        footer: px(q('.footer'))
      };
    }
  };

  boot();
})();
</script>
